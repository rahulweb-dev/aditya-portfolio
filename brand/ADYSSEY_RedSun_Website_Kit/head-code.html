<!-- ===== Part 3: in your stylesheet ===== -->
<style>
:root {
  --surface: #F4EEE5; --surface-raised: #FBF8F2; --surface-high: #EBE1D3;
  --text: #15131C; --text-muted: #5F5A52; --line: #DDD0BF; --line-strong: #8A7B6B;
  --action: #15131C; --on-action: #F4EEE5; --rec: #B8241B; --link: #A3241B; --focus: #A3241B;
  --section-dark: #140D0E; --text-on-dark: #F3EBE0; --muted-on-dark: #C2B3A8; --icon-on-dark: #E3CFAE;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="day"]) {
  --surface: #140D0E; --surface-raised: #22171A; --surface-high: #2E2124;
  --text: #F3EBE0; --text-muted: #C2B3A8; --line: #3A2A2C; --line-strong: #8C7670;
  --action: #F3EBE0; --on-action: #140D0E; --rec: #FF5A48; --link: #E35A52; --focus: #E3CFAE;
  --section-dark: #22171A; color-scheme: dark;
} }
:root[data-mode="night"] {
  --surface: #140D0E; --surface-raised: #22171A; --surface-high: #2E2124;
  --text: #F3EBE0; --text-muted: #C2B3A8; --line: #3A2A2C; --line-strong: #8C7670;
  --action: #F3EBE0; --on-action: #140D0E; --rec: #FF5A48; --link: #E35A52; --focus: #E3CFAE;
  --section-dark: #22171A; color-scheme: dark;
}
body { background: var(--surface); color: var(--text); transition: background-color .6s, color .6s; }

/* The hero: the desert scene, with a soft fade behind the words on the calm sky */
.hero { background: url(/hero/hero-redsun-day-1920x1080.webp) 70% 40% / cover; }
:root[data-mode="night"] .hero { background-image: url(/hero/hero-redsun-night-1920x1080.webp); }
@media (prefers-color-scheme: dark) { :root:not([data-mode="day"]) .hero { background-image: url(/hero/hero-redsun-night-1920x1080.webp); } }

.logo-night { display: none; }
:root[data-mode="night"] .logo-day { display: none; }
:root[data-mode="night"] .logo-night { display: inline; }
</style>
