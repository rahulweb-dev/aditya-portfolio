<!-- ADYSSEY logo: paste these lines inside the <head> of your website.
     First copy every file from 04_Favicon and 05_Social into your site's main public folder
     (on a Vercel / Next.js site that is the "public" folder).
     Replace https://YOUR-SITE.com with your real website address. -->

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0B0A0F">

<!-- Link preview image for WhatsApp, LinkedIn, Facebook and X -->
<meta property="og:image" content="https://YOUR-SITE.com/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Adyssey logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://YOUR-SITE.com/og-image-1200x630.png">


<!-- Logo in the website header (dark website). Copy the SVG into the public folder first. -->
<a href="/" aria-label="Adyssey home">
  <img src="/adyssey-logo-horizontal-light.svg" alt="Adyssey" width="200">
</a>
